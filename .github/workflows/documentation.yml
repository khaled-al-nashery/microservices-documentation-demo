name: documentation

on:
  pull_request:
    paths:
      - "order-service/contracts/**"
      - "order-service/docs/**"
      - "order-service/examples/**"
      - "order-service/service.yaml"
  push:
    branches: [main]
    paths:
      - "order-service/contracts/**"
      - "order-service/docs/**"
      - "order-service/examples/**"
      - "order-service/service.yaml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate OpenAPI + example
        run: python scripts/validate-openapi.py

      - name: Check documentation links
        run: python scripts/check-links.py

      # Hooks for the full pipeline (render diagrams / build docs / publish preview):
